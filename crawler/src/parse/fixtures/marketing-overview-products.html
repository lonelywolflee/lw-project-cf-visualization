<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Products | Cloudflare</title>
    <link rel="canonical" href="https://www.cloudflare.com/products/" />
    <meta
      name="description"
      content="Explore the full Cloudflare developer platform — compute, storage, AI, media, networking, and security products to build and scale any application."
    />
    <meta property="og:title" content="Products | Cloudflare" />
  </head>
  <body>
    <main id="main-content" class="relative w-full max-w-full overflow-x-clip" tabindex="-1">
      <section class="mx-auto w-full max-w-[1200px] pb-24 pt-8 md:pt-12">
        <div class="flex flex-col gap-12">
          <figure class="m-0 w-full">
            <figcaption class="mb-4 ml-8 text-sm font-medium uppercase tracking-wide text-tertiary">
              Compute
            </figcaption>
            <div>
              <div
                class="border-border-100 bg-background-100 relative flex h-full flex-col border-t"
              >
                <a href="/products/workers/" class="group/card flex h-full flex-col p-6 lg:p-8"
                  ><svg viewBox="0 0 24 24" aria-hidden="true">
                    <use href="/icons.svg#productWorkers"></use>
                  </svg>
                  <p class="pt-2 pb-1"><strong>Workers</strong></p>
                  <p class="text-foreground-200/70">Global serverless functions</p></a
                >
              </div>
              <div
                class="border-border-100 bg-background-100 relative flex h-full flex-col border-t lg:border-l"
              >
                <a href="/products/pages/" class="group/card flex h-full flex-col p-6 lg:p-8"
                  ><svg viewBox="0 0 24 24" aria-hidden="true">
                    <use href="/icons.svg#productPages"></use>
                  </svg>
                  <p class="pt-2 pb-1"><strong>Cloudflare Pages</strong></p>
                  <p class="text-foreground-200/70">Build &amp; deploy frontend sites</p></a
                >
              </div>
            </div>
          </figure>
          <figure class="m-0 w-full">
            <figcaption class="mb-4 ml-8 text-sm font-medium uppercase tracking-wide text-tertiary">
              SASE / Zero Trust
            </figcaption>
            <div>
              <div
                class="border-border-100 bg-background-100 relative flex h-full flex-col border-t"
              >
                <a href="/products/access/" class="group/card flex h-full flex-col p-6 lg:p-8"
                  ><svg viewBox="0 0 24 24" aria-hidden="true">
                    <use href="/icons.svg#productAccess"></use>
                  </svg>
                  <p class="pt-2 pb-1"><strong>Access</strong></p>
                  <p class="text-foreground-200/70">Zero trust access to private resources</p></a
                >
              </div>
            </div>
          </figure>
        </div>
      </section>
    </main>
  </body>
</html>
