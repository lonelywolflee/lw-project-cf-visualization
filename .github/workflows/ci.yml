name: CI

on:
  pull_request:
  push:
    branches:
      - feature/init-n-planning

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, validate data, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned by the root package.json
      # "packageManager" field; must run before setup-node's pnpm cache.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests (network-free by contract)
        run: pnpm test

      - name: Validate committed catalog against the shared schema
        run: pnpm validate:data

      - name: Production build (offline — never runs pnpm crawl)
        run: pnpm build
